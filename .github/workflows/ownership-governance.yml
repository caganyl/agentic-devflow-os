name: Ownership Governance

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  pr-quality:
    name: PR Quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout merged pull request result
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify runtime prerequisites
        run: |
          set -euo pipefail
          python3 --version
          git --version

      - name: Check shell and Python syntax
        run: |
          set -euo pipefail

          # Every tracked shell script, not just one hook.
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n

          python3 -m py_compile scripts/*.py

      - name: Lint (ruff F, E9)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.16.8
          ruff check --select F,E9 scripts tests

      - name: Check pull request whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_SHA"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin \
              "refs/pull/${PR_NUMBER}/head"

          unset AUTH_HEADER

          test "$(git rev-parse --verify "${HEAD_SHA}^{commit}")" = "$HEAD_SHA"

          git diff --check "$BASE_SHA" "$HEAD_SHA"

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        # Python 3.9 is not reliably provisioned on current macOS runners;
        # ubuntu keeps the 3.9 floor covered.
        exclude:
          - os: macos-latest
            python-version: "3.9"

    steps:
      - name: Checkout merged pull request result
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for fixture repositories
        run: |
          set -euo pipefail
          git config --global user.name "DevFlow CI"
          git config --global user.email "devflow-ci@users.noreply.github.com"

      - name: Run unit tests
        run: |
          set -euo pipefail
          python --version
          status=0
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee unittest.log || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface failing tests and their last assertion line as
            # annotations so they are readable without downloading logs.
            # One annotation per failure (GitHub keeps at most 10 per step):
            # the test id plus the last lines of its traceback.
            python - <<'PYANN'
          import re
          text = open("unittest.log", encoding="utf-8", errors="replace").read()
          blocks = re.split(r"\n(?==+\n(?:FAIL|ERROR): )", text)
          shown = 0
          for block in blocks:
              m = re.search(r"^(FAIL|ERROR): (.+)$", block, re.M)
              if not m or shown >= 10:
                  continue
              tail = [l for l in block.strip().splitlines() if l.strip() and not l.startswith(("=", "-"))][-4:]
              msg = " | ".join(tail).replace("%", "%25").replace("\r", "").replace("\n", " ")
              print(f"::error title={m.group(1)} {m.group(2)[:120]}::{msg[:900]}")
              shown += 1
          PYANN
          fi
          exit "$status"

  ownership-diff-gate:
    name: Ownership Diff Gate
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch pull request head as Git object only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          actual_base="$(git rev-parse --verify HEAD)"
          test "$actual_base" = "$BASE_SHA"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin \
              "refs/pull/${PR_NUMBER}/head"

          unset AUTH_HEADER

          actual_head="$(git rev-parse --verify FETCH_HEAD)"
          test "$actual_head" = "$HEAD_SHA"

          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Enforce ownership diff policy from trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          python3 scripts/validate_ownership_diff.py \
            --root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --branch "$HEAD_BRANCH"
