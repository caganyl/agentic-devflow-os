name: Ownership Governance

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  pr-quality:
    name: PR Quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout merged pull request result
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify runtime prerequisites
        run: |
          set -euo pipefail
          python3 --version
          git --version

      - name: Check shell and Python syntax
        run: |
          set -euo pipefail

          # Every tracked shell script, not just one hook.
          git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n

          python3 -m py_compile scripts/*.py

      - name: Lint (ruff F, E9)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet ruff==0.16.8
          # Scoped to the CLI/validator/build scripts and their tests; widen to
          # "scripts tests" once the remaining files are clean.
          ruff check --select F,E9 \
            scripts/devflow_operations.py \
            scripts/validate_ownership_manifest.py \
            scripts/validate_ownership_diff.py \
            scripts/devflow_arch_scan.py \
            scripts/build_devflow_plugin.py \
            scripts/build_codex_devflow_plugin.py \
            tests/test_devflow_operations.py \
            tests/test_devflow_delivery_run.py \
            tests/test_contract_evidence_gated_delivery.py \
            tests/test_security_evidence_gated_delivery.py \
            tests/test_work_product_evidence_gate.py \
            tests/test_work_product_ownership_binding.py \
            tests/test_evidence_verification.py \
            tests/test_native_delegation_evidence.py \
            tests/test_run_state_integrity.py \
            tests/test_launch_risk_floor.py \
            tests/test_validate_ownership_manifest.py \
            tests/test_validate_ownership_diff.py \
            tests/test_devflow_arch_scan.py \
            tests/test_devflow_plugin_build.py \
            tests/test_codex_devflow_plugin_build.py \
            tests/test_cli_hardening_ownership.py \
            tests/test_cli_hardening_operations.py

      - name: Check pull request whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_SHA"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin \
              "refs/pull/${PR_NUMBER}/head"

          unset AUTH_HEADER

          test "$(git rev-parse --verify "${HEAD_SHA}^{commit}")" = "$HEAD_SHA"

          git diff --check "$BASE_SHA" "$HEAD_SHA"

  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        # Python 3.9 is not reliably provisioned on current macOS runners;
        # ubuntu keeps the 3.9 floor covered.
        exclude:
          - os: macos-latest
            python-version: "3.9"

    steps:
      - name: Checkout merged pull request result
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity for fixture repositories
        run: |
          set -euo pipefail
          git config --global user.name "DevFlow CI"
          git config --global user.email "devflow-ci@users.noreply.github.com"

      - name: Run unit tests
        run: |
          set -euo pipefail
          python --version
          status=0
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee unittest.log || status=$?
          if [ "$status" -ne 0 ]; then
            # Surface failing tests and their last assertion line as
            # annotations so they are readable without downloading logs.
            grep -E '^(FAIL|ERROR): ' unittest.log | head -20 | while IFS= read -r line; do
              echo "::error title=unittest::${line}"
            done
            grep -E '^[A-Za-z]*(Error|Exception): ' unittest.log | head -20 | while IFS= read -r line; do
              echo "::error title=unittest detail::${line}"
            done
          fi
          exit "$status"

  ownership-diff-gate:
    name: Ownership Diff Gate
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch pull request head as Git object only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          actual_base="$(git rev-parse --verify HEAD)"
          test "$actual_base" = "$BASE_SHA"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"

          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin \
              "refs/pull/${PR_NUMBER}/head"

          unset AUTH_HEADER

          actual_head="$(git rev-parse --verify FETCH_HEAD)"
          test "$actual_head" = "$HEAD_SHA"

          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Enforce ownership diff policy from trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          python3 scripts/validate_ownership_diff.py \
            --root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --branch "$HEAD_BRANCH"
