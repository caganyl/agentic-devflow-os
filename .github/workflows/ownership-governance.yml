name: Ownership Governance

on:
  pull_request:
    branches:
      - main
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  pr-quality:
    name: PR Quality
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout merged pull request result
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify runtime prerequisites
        run: |
          set -euo pipefail
          python3 --version
          git --version

      - name: Check hook and Python syntax
        run: |
          set -euo pipefail

          bash -n .claude/hooks/enforce-role-boundaries.sh

          python3 -m py_compile \
            scripts/validate_ownership_manifest.py \
            scripts/validate_ownership_diff.py \
            tests/test_validate_ownership_manifest.py \
            tests/test_enforce_role_boundaries.py \
            tests/test_validate_ownership_diff.py

      - name: Run unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check pull request whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin \
            "refs/pull/${PR_NUMBER}/head"

          test "$(git rev-parse --verify "${HEAD_SHA}^{commit}")" = "$HEAD_SHA"

          git diff --check "$BASE_SHA" "$HEAD_SHA"

  ownership-diff-gate:
    name: Ownership Diff Gate
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout trusted base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Fetch pull request head as Git object only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Invalid pull request number."
            exit 1
          fi

          if ! [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid base SHA."
            exit 1
          fi

          if ! [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid head SHA."
            exit 1
          fi

          actual_base="$(git rev-parse --verify HEAD)"
          test "$actual_base" = "$BASE_SHA"

          git fetch --no-tags --no-recurse-submodules --depth=1 origin \
            "refs/pull/${PR_NUMBER}/head"

          actual_head="$(git rev-parse --verify FETCH_HEAD)"
          test "$actual_head" = "$HEAD_SHA"

          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Enforce ownership diff policy from trusted base code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          python3 scripts/validate_ownership_diff.py \
            --root . \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --branch "$HEAD_BRANCH"
